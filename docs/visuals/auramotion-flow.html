<style>
:root{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#203047;background:#f8fafc;--blue:#2563eb;--line:#dce4ed;--muted:#65748a}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #6c9cff;outline-offset:4px}.workspace{position:fixed;inset:0;overflow:hidden;isolation:isolate}.viewport{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;user-select:none;background-image:radial-gradient(#cdd7e3 1px,transparent 1px);background-size:20px 20px;outline:none}.viewport.dragging,.viewport.dragging *{cursor:grabbing!important}.world{width:2520px;height:1560px;position:absolute;transform-origin:0 0;will-change:transform}.edges{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}.edge{fill:none;stroke:#b2bfce;stroke-width:1.7}.edge.support{stroke-dasharray:5 6;stroke:#bdc9d9}.edge.related{stroke:var(--blue);stroke-width:2.6}.lane{position:absolute;left:28px;right:15px;border-top:1px solid #dce5ef;padding-top:15px;color:#78879a;font-size:15px;pointer-events:none}.stage{position:absolute;top:58px;display:flex;align-items:center;gap:12px;font-size:18px;font-weight:600;pointer-events:none}.stage b{font-size:13px;font-weight:500;background:#e9eff7;border-radius:6px;padding:7px;color:#64768f}.node{position:absolute;width:280px;height:116px;text-align:left;border:1px solid #d9e1eb;border-radius:12px;background:white;padding:17px 19px;box-shadow:0 3px 8px #253c5910;cursor:grab;touch-action:none;-webkit-tap-highlight-color:transparent;transition:border-color .12s}.node:hover{border-color:#8cacdf}.node.selected{border-color:var(--blue);box-shadow:0 0 0 2px #2563eb,0 3px 8px #253c5910}.node .kind{font-size:11px;color:var(--accent);display:flex;align-items:center;gap:6px;margin-bottom:8px}.node .kind:before{content:"";width:6px;height:6px;background:var(--accent);border-radius:50%}.node strong{display:block;font-size:21px;font-weight:600;letter-spacing:-.5px}.node small{display:block;margin-top:7px;color:var(--muted);font-size:12px}.port{position:absolute;top:51px;width:10px;height:10px;background:white;border:2px solid #a5b6ca;border-radius:50%}.port.in{left:-6px}.port.out{right:-6px}.flag{position:absolute;right:15px;top:15px;font-size:11px;color:#9b690c;background:#fff6db;border-radius:5px;padding:3px 6px}.controls{position:absolute;left:20px;bottom:20px;display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;background:#fff;box-shadow:0 3px 12px #2030470c;overflow:hidden}.controls button{border:0;background:white;padding:11px 14px;font-size:18px;touch-action:manipulation}.controls button:hover{background:#edf4ff}.controls output{font-size:12px;min-width:48px;text-align:center}.controls .fit{font-size:12px;border-left:1px solid var(--line)}.minimap{position:absolute;right:20px;bottom:20px;background:#ffffffed;border:1px solid var(--line);border-radius:10px;padding:12px;width:208px;height:131px}.minimap svg{width:100%;height:100%;cursor:crosshair;touch-action:none}.map-view{fill:#2563eb12;stroke:#2563eb;stroke-width:9}.workspace:has(.detail.open) .minimap{right:430px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.detail{position:absolute;right:0;top:0;bottom:0;width:410px;background:#fff;border-left:1px solid var(--line);box-shadow:-10px 0 35px #213b5910;z-index:4;overflow:auto;padding:26px;transform:translateX(102%);visibility:hidden;transition:transform .2s,visibility .2s}.detail.open{transform:none;visibility:visible}.close{float:right;border:1px solid var(--line);background:#fff;border-radius:7px;width:32px;height:32px;font-size:20px}.detail .tag{font-size:12px;color:var(--blue);margin:6px 0 15px}.detail h3{font-size:29px;line-height:1.2;letter-spacing:-.8px;margin:0 35px 12px 0}.summary{font-size:15px;line-height:1.7;color:#596a80}.detail h4{font-size:13px;color:#758399;margin:26px 0 10px;font-weight:500}.chips{display:flex;gap:6px;flex-wrap:wrap}.chips span{font-size:12px;background:#f0f5fc;border-radius:5px;padding:6px 8px;color:#355b8a}.steps{padding-left:20px;font-size:14px;line-height:1.65}.steps li{margin:8px 0}.note{border-left:3px solid #e4b148;background:#fff9e9;border-radius:0 6px 6px 0;padding:12px 14px;font-size:13px;line-height:1.65}.related-list{display:flex;gap:6px;flex-wrap:wrap}.related-list button{font-size:12px;border:1px solid #cadcf7;background:#f5f9ff;border-radius:6px;padding:7px 9px;color:#34629c}.source{font-size:11px;color:#78879a;overflow-wrap:anywhere;line-height:1.8}
.detail{overscroll-behavior:contain;transition:transform .18s ease-out,visibility .18s;will-change:transform}.detail.open{transform:translateX(0)}.close{position:sticky;top:0;background:white;z-index:1}.detail h4{margin-top:24px}@media(max-width:700px){.detail{width:min(410px,100%)}.controls{left:12px;bottom:16px}.controls button{padding:11px}.minimap{width:125px;height:88px;right:12px;bottom:16px;padding:7px}.workspace:has(.detail.open) .minimap{visibility:hidden}.controls output{min-width:38px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<main class="workspace" aria-label="Sơ đồ chức năng tương tác">
<div id="viewport" class="viewport" tabindex="0" aria-label="Kéo nền để di chuyển, kéo node để sắp xếp. Cuộn hoặc chụm hai ngón để zoom. Phím mũi tên để dịch sơ đồ."><div class="world" id="world"><svg class="edges" id="edges" aria-hidden="true"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a9bbd1"/></marker></defs></svg></div></div>

<script>
'use strict';
// Tài liệu độc lập, không cần CDN, tài khoản, API hay dịch vụ AI đang chạy.
const nodes=[];
const colors={user:'#2563eb',ai:'#16877a',billing:'#a16c16',admin:'#7d61b3'};
function add(id,col,row,title,sub,tech,steps,note,source,type='user'){nodes.push({id,stage:col,x:50+col*350,y:130+row*154,title,sub,tech,steps,note,source,type});}
add('login',0,0,'Đăng nhập','Email / Google · Đăng xuất',['NextAuth v5','JWT','bcrypt'],['Email + mật khẩu được kiểm tra với hash trong PostgreSQL.','Google OAuth chỉ bật khi cấu hình AUTH_GOOGLE_ID; tài khoản Google được liên kết theo email.','JWT tạo phiên; middleware bảo vệ Studio, Thư viện, Credit, Hồ sơ và Admin.'], 'Tài khoản bị khóa bị chặn khi nạp user ở server. Google cần thông tin OAuth hợp lệ.','src/lib/auth.ts · src/lib/auth.config.ts');
add('register',0,1,'Đăng ký','Tạo tài khoản + nhận gói Free',['Zod','bcrypt','Prisma'],['Chuẩn hóa email, kiểm tra tên và mật khẩu tối thiểu 8 ký tự.','Hash mật khẩu rồi tạo User + thuê bao Free trong một transaction.','Cấp Credit gói đầu tiên để bắt đầu tạo nội dung.'],'Không thấy bước xác minh email cho đăng ký bằng mật khẩu trong mã hiện tại.','src/server/services/account.ts');
add('reset',0,2,'Quên mật khẩu','Gửi email → đặt mật khẩu mới',['Nodemailer','SHA-256','crypto'],['Tạo token ngẫu nhiên, chỉ lưu hash và thời điểm hết hạn.','Gửi link qua email; token hợp lệ được đánh dấu đã dùng trong transaction.','Đặt mật khẩu mới và quay lại đăng nhập.'],'Token chỉ dùng một lần, hạn 1 giờ. Cần SMTP để nhận email thật.','src/server/services/account.ts · src/lib/mail.ts');
add('profile',0,3,'Hồ sơ cá nhân','Tên · Avatar · Mật khẩu',['React','Zod','bcrypt'],['Cập nhật tên và URL avatar qua API /api/me.','Đổi mật khẩu yêu cầu mật khẩu cũ khi đã có passwordHash.','Tài khoản chỉ dùng Google có thể đặt mật khẩu lần đầu.'],'Thông tin hồ sơ thuộc user đang đăng nhập.','src/components/account/ProfileForm.tsx · src/server/services/account.ts');
add('access',1,0,'Gói & quyền dùng','Free / Pro / Ultra',['Prisma','PostgreSQL','Zod'],['Nạp gói đang hoạt động và catalog model được bật.','Kiểm tra rank model, thời lượng, tỷ lệ khung hình và số tác vụ đồng thời ở server.','Áp dụng ưu tiên Ultra → Pro → Free trong hàng đợi.'],'Mặc định seed: Free 1 job/5s; Pro 3 job/10s; Ultra 6 job/10s. Admin có thể đổi cấu hình.','src/server/services/pricing.ts · src/server/services/job.ts · prisma/seed.ts');
add('balance',1,1,'Ví Credit','Số dư · Giữ chỗ · Lịch sử',['Prisma Decimal','SQL row lock'],['Tách Credit gói và Credit mua thêm bằng sổ giao dịch.','Khi tạo job: giữ Credit; thành công: chốt phí; thất bại: hoàn phần được phép.','Hiển thị số dư và lịch sử thu/chi ở /credits.'],'Credit gói hết hạn theo kỳ; Credit mua thêm là bucket riêng. Hoàn phí không hồi sinh Credit gói đã hết hạn.','src/server/services/credit.ts · src/components/billing/CreditsView.tsx','billing');
add('quote',1,2,'Báo giá trước','Chi phí thay đổi theo đầu vào',['Zod','Prisma Decimal'],['Ảnh = giá gốc × số ảnh. Video = giá gốc × số giây / 5.','Ghép = giá gốc + phí mỗi câu × số câu thoại.','Form hỏi /api/jobs/quote; createJob tính lại giá trước khi giữ Credit.'],'Giá seed chỉ là mặc định. Không tin chi phí gửi từ trình duyệt.','src/server/services/pricing.ts · src/app/api/jobs/quote/route.ts','billing');
add('idea',2,0,'Viết prompt bằng AI','Ý tưởng → prompt / lời thoại',['agy CLI','codex CLI','Node.js'],['Nhập ý tưởng và chọn ảnh, video hoặc kịch bản.','Đọc cấu hình prompt_writer để chọn agy/codex và model.','Trả prompt hoặc danh sách câu để người dùng sửa trước khi tạo.'],'Mỗi user tối đa 1 yêu cầu viết đang chạy trên tiến trình app; CLI cần được đăng nhập sẵn.','src/app/api/ai/prompt/route.ts · src/server/engines/prompt-writer.ts','ai');
add('upload',2,1,'Ảnh tham chiếu','Upload ảnh / dùng lại ảnh đã tạo',['Multipart','Node fs','Storage local'],['Upload ảnh và lưu dưới uploads/{userId}.','Dùng ảnh làm tham chiếu cho ảnh mới hoặc khung đầu video.','Server kiểm tra đầu vào là upload hoặc kết quả thành công của chính user.'],'Giới hạn upload 10 MB; ảnh đầu vào PNG, JPEG hoặc WebP.','src/app/api/uploads/route.ts · src/lib/storage.ts · src/server/services/job.ts');
add('preset',2,2,'Style & camera','Phong cách ảnh · Chuyển động',['Prisma','Prompt composition'],['Chọn Style cho ảnh hoặc Camera cho video.','Nối promptSuffix vào prompt trước khi gọi engine.','Tỷ lệ ảnh và số lượng lấy theo options của model.'],'Seed có 4 style và 6 camera; đây là hướng dẫn prompt, không phải bộ dựng cảnh 3D.','prisma/seed.ts · src/server/engines/index.ts · src/components/studio/PresetPicker.tsx');
add('image',3,0,'Tạo ảnh AI','MUSE / Gemini qua agy / Codex',['MUSE HTTP','agy CLI','codex CLI'],['Chọn engine, prompt, tỷ lệ khung hình và ảnh tham chiếu nếu có.','MUSE hỗ trợ 1/2/4 ảnh theo seed; agy và Codex mặc định 1 ảnh.','Job chạy bất đồng bộ và lưu kết quả vào thư viện.'],'Codex Ảnh yêu cầu Pro trở lên theo seed. Chất lượng thực tế phụ thuộc engine và phiên đăng nhập.','src/components/studio/GenerateForm.tsx · src/server/engines/{muse,agy,codex}.ts','ai');
add('video',3,1,'Tạo video AI','Prompt / ảnh đầu → video 5–10s',['MUSE','muse2api'],['Nhập prompt, chọn camera, khung 9:16 / 16:9 / 1:1.','Có thể dùng ảnh làm khung đầu. Gửi task sang muse2api.','Lưu museTaskId, poll kết quả và tải video về storage.'],'Free mặc định tối đa 5 giây. MUSE cần tài khoản hoạt động; mock không chứng minh chạy thật.','src/server/engines/muse.ts · src/server/services/job.ts','ai');
add('enqueue',4,0,'Tạo & giữ chỗ job','Kiểm tra → hold → enqueue',['PostgreSQL transaction','BullMQ','Redis'],['Kiểm tra bảo trì, model, quyền gói, preset và quyền sở hữu đầu vào.','Khóa user, kiểm tra số job đang chờ/chạy, tạo job và hold Credit.','Đưa vào queue muse / cli / post theo provider.'],'Không đưa được vào queue thì đánh lỗi và hoàn Credit. Trình duyệt chỉ gửi yêu cầu, worker mới xử lý.','src/server/services/job.ts · src/lib/queue.ts','ai');
add('worker',4,1,'Worker xử lý nền','Chạy độc lập với web app',['BullMQ Worker','Redis','Node.js'],['Queue muse gọi HTTP; cli chạy agy/codex; post chạy ghép video.','Theo dõi trạng thái PENDING → RUNNING → SUCCEEDED hoặc FAILED.','Kết quả được chép về storage rồi chốt Credit.'],'Web app và worker đều phải chạy. post mặc định 1 tác vụ; MUSE_CONCURRENCY nên khớp số tài khoản MUSE.','worker/index.ts · src/server/services/job.ts','ai');
add('recovery',4,2,'Lỗi & chạy lại','Timeout · Hoàn phí · Hủy chờ',['BullMQ retries','Cron','AbortSignal'],['Retry tự động áp dụng cho lỗi sinh ảnh/video đủ điều kiện; queue mặc định 3 attempts.','Sweeper đánh lỗi job quá hạn; failJob hoàn Credit.','Admin có thể hủy PENDING hoặc tạo job mới từ job FAILED.'],'Timeout: muse 15 phút, cli 12 phút, post 20 phút. Ghép lỗi kết thúc và hoàn phí, không tự ghép lại.','src/server/services/job.ts · worker/processors/assemble.ts · src/app/api/admin/jobs/[id]/route.ts','ai');
add('library',5,0,'Thư viện kết quả','Ảnh · Video · Video ghép',['React','Prisma','HTTP polling'],['Lọc theo loại và trạng thái; tải thêm bằng cursor.','Poll các job đang chờ/chạy mỗi 3 giây.','Mở chi tiết để xem file, prompt, model, giá và thời hạn lưu.'],'Danh sách và trang chi tiết kiểm tra user sở hữu job. Không có realtime WebSocket trong luồng này.','src/components/library/JobGrid.tsx · src/app/(user)/library/[id]/page.tsx');
add('reuse',5,1,'Tạo lại & tải xuống','Dùng lại thông số · Xóa kết quả',['React','HTML media','Download'],['Xem ảnh hoặc phát video, tải từng file kết quả.','Tạo lại mở Studio với thông số cũ để chỉnh và gửi job mới.','Xóa job đã kết thúc: ẩn bản ghi và xóa file kết quả.'],'Tạo lại tính phí như job mới. User không có nút hủy/retry trực tiếp như Admin; không xóa được job đang chạy.','src/components/library/MediaViewer.tsx · src/lib/api-client.ts · src/server/services/job.ts');
add('storage',5,2,'Lưu & phục vụ media','Ổ đĩa local · Stream Range',['Node fs','HTTP 206','STORAGE_DIR'],['File upload, preview giọng và kết quả nằm trên ổ đĩa cấu hình.','Route /media/[...key] đọc file và hỗ trợ Range cho video/audio.','Cron dọn kết quả Free khi quá hạn lưu.'],'Free: expiresAt được đặt 30 ngày từ lúc tạo job. Route media hiện không yêu cầu đăng nhập: có URL có thể đọc file.','src/lib/storage.ts · src/app/media/[...key]/route.ts · src/server/services/job.ts','ai');
add('edit',6,0,'Ghép & xuất video','Timeline → video hoàn chỉnh',['Python','ffmpeg','ffprobe'],['Chọn ảnh/video đã tạo từ thư viện và sắp thứ tự clip.','Ghép hình, lời thoại, nhạc, phụ đề bằng tools/post/assemble.py.','Xuất MP4 về cùng thư viện, tải xuống như video AI.'],'Đây là dựng ghép từ kết quả đã tạo; không có luồng upload video ngoài làm clip trong form hiện tại.','src/components/studio/AssembleForm.tsx · worker/processors/assemble.ts · tools/post/assemble.py','ai');
add('clips',6,1,'Biên tập clip','Sắp xếp · Cắt · Thời lượng',['React timeline','ffmpeg'],['Chọn tối đa 12 clip là ảnh/video SUCCEEDED của chính user.','Ảnh: đặt thời lượng 1–10 giây; video: đặt điểm in/out.','Chọn khung xuất 9:16, 16:9 hoặc 1:1.'],'Clip đã xóa/hết hạn sẽ không dùng lại được; worker kiểm tra lại file trước lúc ghép.','src/components/studio/ClipTimeline.tsx · src/server/services/pricing.ts · worker/processors/assemble.ts');
add('voice',6,2,'Giọng đọc & nghe thử','VieNeu · Giọng có sẵn / của tôi',['VieNeu TTS','Python','WAV cache'],['Nhập lời thoại, mỗi dòng một câu; có AI viết kịch bản.','Chọn giọng có sẵn hoặc upload audio tham chiếu để clone giọng.','Nghe thử giọng, sau đó tạo audio theo câu khi ghép.'],'Clone giọng yêu cầu Pro+. Tối đa 20 câu × 200 ký tự; nghe thử tối đa 120 ký tự. CPU có thể xử lý chậm.','src/components/studio/ScriptEditor.tsx · src/server/engines/voice.ts · src/app/api/voices/preview/route.ts','ai');
add('sound',6,3,'Nhạc & phụ đề','Nhạc nền · Lời thoại · Tiếng gốc',['ffmpeg libass','SRT / ASS','MP3'],['Chọn nhạc từ danh sách Admin cấu hình, có nghe thử nhạc.','Bật/tắt phụ đề và giữ âm thanh gốc của clip.','Ghép audio và đốt phụ đề vào video đầu ra.'],'Cần ffmpeg có libass và font hỗ trợ tiếng Việt; file nhạc phải có sẵn trong public/music.','src/components/studio/MusicPicker.tsx · tools/post/assemble.py','ai');
// Nhánh thương mại: không phải bước bắt buộc sau khi xuất video.

const links=[['register','login'],['reset','login'],['login','access'],['login','profile'],['access','idea'],['access','balance'],['balance','quote'],['idea','image'],['upload','image'],['upload','video'],['preset','image'],['preset','video'],['image','enqueue'],['video','enqueue'],['quote','enqueue'],['enqueue','worker'],['worker','library'],['worker','recovery'],['recovery','balance'],['library','reuse'],['library','storage'],['library','edit'],['clips','edit'],['voice','edit'],['sound','edit'],['edit','enqueue','support'],['edit','library','support'],['plans','payment'],['payment','webhook'],['webhook','subscription'],['subscription','access','support'],['subscription','balance','support'],['admin','stats'],['admin','users'],['users','models'],['models','config'],['config','adminjobs'],['adminjobs','ops'],['models','image','support'],['config','quote','support'],['adminjobs','recovery','support'],['ops','storage','support']];
const stages=['Tài khoản','Quyền truy cập','Chuẩn bị','Tạo media','Xử lý nền','Thư viện','Hậu kỳ'];
const world=document.querySelector('#world'),svg=document.querySelector('#edges'),view=document.querySelector('#viewport'),detail=document.querySelector('#detail'),mini=document.querySelector('#mini');
const byId=new Map(nodes.map(n=>[n.id,n]));let selected=null,scale=.85,tx=32,ty=5,drag=null,moved=false,returnFocus=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function elSvg(name,attrs){const e=document.createElementNS('http://www.w3.org/2000/svg',name);for(const [k,v]of Object.entries(attrs))e.setAttribute(k,v);return e;}
stages.forEach((name,i)=>{const el=document.createElement('div');el.className='stage';el.style.left=(50+i*350)+'px';el.innerHTML=`<b>0${i+1}</b>${name}`;world.append(el);});
[[970,'Thanh toán & vòng đời gói · Nhánh tùy nhu cầu'],[1278,'Quản trị & vận hành · Nhánh ADMIN / hệ thống']].forEach(([y,text])=>{const e=document.createElement('div');e.className='lane';e.style.top=y+'px';e.textContent=text;world.append(e);});
// Row 6 starts at 1054, row 8 at 1362; canvas extends to include all nodes.
world.style.height='1560px';world.style.width='2520px';
for(const [from,to,type]of links){const a=byId.get(from),b=byId.get(to);const forward=b.x>a.x;const same=a.x===b.x;let d;
if(same){const ax=a.x+280,ay=a.y+58,by=b.y+58;d=`M${ax} ${ay} C${ax+45} ${ay},${ax+45} ${by},${ax} ${by}`;}
else{const ax=a.x+(forward?280:0),bx=b.x+(forward?0:280),ay=a.y+58,by=b.y+58,curve=Math.max(45,Math.abs(bx-ax)*.45);d=`M${ax} ${ay} C${ax+(forward?curve:-curve)} ${ay},${bx+(forward?-curve:curve)} ${by},${bx} ${by}`;}
const p=elSvg('path',{d,class:'edge'+(type?' '+type:''),'marker-end':'url(#arrow)'});p.dataset.from=from;p.dataset.to=to;svg.append(p);}
for(const n of nodes){const b=document.createElement('button');b.className='node';b.id='node-'+n.id;b.dataset.id=n.id;b.style.cssText=`left:${n.x}px;top:${n.y}px;--accent:${colors[n.type]}`;b.setAttribute('aria-label',n.title+' — '+n.sub);b.setAttribute('aria-expanded','false');b.innerHTML=`<i class="port in"></i><span class="kind">${({user:'Trải nghiệm',ai:'Xử lý & công nghệ',billing:'Gói & Credit',admin:'Quản trị'})[n.type]}</span>${['access','recovery','storage','webhook','ops'].includes(n.id)?'<span class="flag">Lưu ý</span>':''}<strong>${esc(n.title)}</strong><small>${esc(n.sub)}</small><i class="port out"></i>`;b.onclick=()=>{if(!moved)openNode(n.id)};world.append(b);mini.append(elSvg('rect',{x:n.x,y:n.y,width:280,height:116,rx:16,fill:colors[n.type],opacity:.45}));}
const mapView=elSvg('rect',{class:'map-view',x:0,y:0,width:800,height:600});mini.append(mapView);
let frame=0;
function render(){frame=0;world.style.transform=`translate3d(${tx}px,${ty}px,0) scale(${scale})`;view.style.backgroundSize=`${20*scale}px ${20*scale}px`;view.style.backgroundPosition=`${tx}px ${ty}px`;document.querySelector('#zoom').textContent=Math.round(scale*100)+'%';mapView.setAttribute('x',-tx/scale);mapView.setAttribute('y',-ty/scale);mapView.setAttribute('width',view.clientWidth/scale);mapView.setAttribute('height',view.clientHeight/scale);}
function update(){if(!frame)frame=requestAnimationFrame(render);}
function zoomAt(factor,x=view.clientWidth/2,y=view.clientHeight/2){const next=Math.min(1.8,Math.max(.15,scale*factor));tx=x-(x-tx)*next/scale;ty=y-(y-ty)*next/scale;scale=next;update();}
function openNode(id){const n=byId.get(id);selected=id;returnFocus=document.querySelector('#node-'+id);const related=[...new Set(links.filter(l=>l[0]===id||l[1]===id).flatMap(l=>l.slice(0,2)).filter(i=>i!==id))];document.querySelectorAll('.node').forEach(b=>{b.classList.toggle('selected',b.dataset.id===id);b.setAttribute('aria-expanded',b.dataset.id===id?'true':'false');});document.querySelectorAll('.edge').forEach(p=>p.classList.toggle('related',p.dataset.from===id||p.dataset.to===id));detail.innerHTML=`<button class="close" aria-label="Đóng chi tiết">×</button><p class="tag">${stages[n.stage]} / ${n.type==='admin'?'Quản trị':n.type==='billing'?'Thanh toán':'Chức năng'}</p><h3>${esc(n.title)}</h3><p class="summary">${esc(n.sub)}</p><h4>Công nghệ cần có</h4><div class="chips">${n.tech.map(t=>`<span>${esc(t)}</span>`).join('')}</div><h4>Cách làm & hoạt động</h4><ol class="steps">${n.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><h4>Cần chú ý</h4><div class="note">${esc(n.note)}</div><h4>Liên quan trực tiếp</h4><div class="related-list">${related.map(i=>`<button data-link="${i}">${esc(byId.get(i).title)}</button>`).join('')}</div><h4>Đối chiếu mã nguồn</h4><p class="source">${esc(n.source)}</p>`;detail.inert=false;detail.classList.add('open');detail.querySelector('.close').onclick=()=>closeDetail(true);detail.querySelectorAll('[data-link]').forEach(b=>b.onclick=()=>openNode(b.dataset.link));detail.scrollTop=0;if(view.clientWidth<=700||document.activeElement?.closest('.detail'))detail.querySelector('.close').focus({preventScroll:true});document.querySelector('#announce').textContent='Đang xem '+n.title;}
function closeDetail(focus=false){detail.classList.remove('open');detail.inert=true;selected=null;document.querySelectorAll('.node').forEach(b=>{b.classList.remove('selected');b.setAttribute('aria-expanded','false')});document.querySelectorAll('.related').forEach(p=>p.classList.remove('related'));if(focus&&returnFocus)returnFocus.focus({preventScroll:true});}
const pointers=new Map();let pinch=null,suppressClick=false;
// Keep links and minimap attached while moving a node.
function moveNode(n,x,y){n.x=x;n.y=y;const b=document.querySelector('#node-'+n.id);b.style.left=x+'px';b.style.top=y+'px';const m=mini.querySelector(`[data-node="${n.id}"]`);m.setAttribute('x',x);m.setAttribute('y',y);svg.querySelectorAll('path[data-from]').forEach(p=>{if(p.dataset.from!==n.id&&p.dataset.to!==n.id)return;const a=byId.get(p.dataset.from),b=byId.get(p.dataset.to),f=b.x>a.x,ax=a.x+(f?280:0),bx=b.x+(f?0:280),ay=a.y+58,by=b.y+58,c=Math.max(45,Math.abs(bx-ax)*.45);p.setAttribute('d',a.x===b.x?`M${ax} ${ay} C${ax+45} ${ay},${ax+45} ${by},${ax} ${by}`:`M${ax} ${ay} C${ax+(f?c:-c)} ${ay},${bx+(f?-c:c)} ${by},${bx} ${by}`);});}
mini.querySelectorAll('rect:not(.map-view)').forEach((r,i)=>r.dataset.node=nodes[i].id);
view.addEventListener('pointerdown',e=>{
 if(e.button!==0&&e.button!==1)return;
 pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(e.pointerType==='mouse')e.preventDefault();
 suppressClick=false;moved=false;
 if(pointers.size===2){const [a,b]=[...pointers.values()],r=view.getBoundingClientRect();pinch={distance:Math.hypot(a.x-b.x,a.y-b.y),scale,wx:((a.x+b.x)/2-r.left-tx)/scale,wy:((a.y+b.y)/2-r.top-ty)/scale};drag=null;suppressClick=true;return;}
 const node=e.button===0?e.target.closest('.node'):null;const n=node?byId.get(node.dataset.id):null;
 drag={pointer:e.pointerId,x:e.clientX,y:e.clientY,tx,ty,node:n,nx:n?.x,ny:n?.y,started:false};
});
view.addEventListener('pointermove',e=>{
 if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pinch&&pointers.size===2){const [a,b]=[...pointers.values()],r=view.getBoundingClientRect();scale=Math.min(1.8,Math.max(.15,pinch.scale*Math.hypot(a.x-b.x,a.y-b.y)/pinch.distance));tx=(a.x+b.x)/2-r.left-pinch.wx*scale;ty=(a.y+b.y)/2-r.top-pinch.wy*scale;suppressClick=true;update();return;}
 if(!drag||drag.pointer!==e.pointerId)return;
 const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!drag.started&&Math.hypot(dx,dy)<6)return;
 if(!drag.started){drag.started=true;view.setPointerCapture(e.pointerId);view.classList.add('dragging');}
 moved=true;suppressClick=true;
 if(drag.node)moveNode(drag.node,drag.nx+dx/scale,drag.ny+dy/scale);else{tx=drag.tx+dx;ty=drag.ty+dy;update();}
});
function endPointer(e){pointers.delete(e.pointerId);if(pinch){pinch=null;drag=null;suppressClick=true;}if(drag?.pointer===e.pointerId){if(!drag.started&&!drag.node&&e.type==='pointerup')closeDetail();drag=null;}if(view.hasPointerCapture(e.pointerId))view.releasePointerCapture(e.pointerId);view.classList.remove('dragging');moved=false;}
view.addEventListener('pointerup',endPointer);view.addEventListener('pointercancel',endPointer);
view.addEventListener('click',e=>{if(suppressClick){e.preventDefault();e.stopImmediatePropagation();suppressClick=false;}},true);
view.addEventListener('wheel',e=>{e.preventDefault();const r=view.getBoundingClientRect();if(e.shiftKey){tx-=e.deltaY;update();return;}if(e.deltaX&&!e.ctrlKey&&!e.metaKey){tx-=e.deltaX;ty-=e.deltaY;update();return;}const delta=e.deltaY*(e.deltaMode===1?16:e.deltaMode===2?view.clientHeight:1);zoomAt(Math.exp(-delta*(e.ctrlKey?.009:.002)),e.clientX-r.left,e.clientY-r.top);},{passive:false});
document.querySelector('#plus').onclick=()=>zoomAt(1.18);document.querySelector('#minus').onclick=()=>zoomAt(1/1.18);
document.querySelector('#fit').onclick=()=>{closeDetail();scale=Math.min((view.clientWidth-60)/2520,(view.clientHeight-80)/1560);tx=(view.clientWidth-2520*scale)/2;ty=40;update();};
document.querySelector('#home').onclick=()=>{closeDetail();scale=.85;tx=30;ty=5;update();};
mini.onclick=e=>{const r=mini.getBoundingClientRect();const s=Math.min(r.width/2520,r.height/1560);const x=(e.clientX-r.left-(r.width-2520*s)/2)/s,y=(e.clientY-r.top-(r.height-1560*s)/2)/s;tx=view.clientWidth/2-x*scale;ty=view.clientHeight/2-y*scale;update();};
view.addEventListener('keydown',e=>{if(e.target!==view)return;const d=80;if(e.key==='ArrowRight')tx-=d;else if(e.key==='ArrowLeft')tx+=d;else if(e.key==='ArrowDown')ty-=d;else if(e.key==='ArrowUp')ty+=d;else if(e.key==='+')zoomAt(1.18);else if(e.key==='-')zoomAt(1/1.18);else return;e.preventDefault();update();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail(true)});
window.addEventListener('resize',update);update();
</script>
